<style>
:root{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{scroll-padding-top:150px}*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;color:var(--tx);font:16px/1.5 var(--fb),system-ui,sans-serif;overflow-x:hidden}

h1{font:900 clamp(1.5rem,7.5vw,2.8rem)/1.15 var(--fh),sans-serif;letter-spacing:.1em;margin:6px 0 8px;background:var(--h1);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.sub{color:var(--mu);margin:0 0 16px;min-height:3em}.sub.sw{animation:fi .6s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.hud,.card{background:var(--sf);color:var(--st);border:var(--bw,1px) var(--bs,solid) var(--ln);border-radius:var(--rad);box-shadow:var(--sh,none)}
.hud{padding:16px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lv{font:700 1.05rem var(--fh),sans-serif;color:var(--ac);letter-spacing:.08em}
.rank,.note{color:var(--pm)}.rank{font-size:.9rem}
.xp{height:12px;background:rgba(0,0,0,.35);border-radius:8px;margin:12px 0 6px;overflow:hidden}
.xp i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:300% 100%;box-shadow:0 0 14px var(--ac);transition:width .9s cubic-bezier(.2,.9,.3,1.2);animation:flow 3s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bar) 75%,transparent);padding:12px 0 10px;margin-top:8px}
.srow{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;padding:12px 18px;font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--ln);border-radius:var(--prad,30px)}
input[type=search]:focus{outline:none;border-color:var(--ac);box-shadow:0 0 20px -2px var(--ac)}
.btn{font:700 .72rem var(--fh),sans-serif;letter-spacing:.05em;padding:0 16px;border:0;border-radius:var(--prad,30px);background:var(--btn);color:#fff;cursor:pointer;box-shadow:0 0 20px -4px var(--ac);transition:transform .15s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 0 30px var(--ac)}.btn:active{transform:scale(.94)}
.chips{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;margin-top:10px;padding:6px 2px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--ln);border-radius:var(--prad,30px);background:var(--chip);color:var(--tx);font:600 .88rem var(--fb),sans-serif;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.chip:hover{transform:translateY(-3px);border-color:var(--c,var(--ac));box-shadow:0 6px 18px -6px var(--c,var(--ac))}
.chip[aria-pressed=true]{background:var(--c,var(--ac));border-color:var(--c,var(--ac));color:var(--on)}
.chip small{opacity:.7}
.flt{display:flex;gap:14px;color:var(--mu);font-size:.88rem;align-items:center;flex-wrap:wrap}.flt label{cursor:pointer}.flt input{accent-color:var(--ac)}
h2{font:700 1.05rem/1.5 var(--fh),sans-serif;letter-spacing:.1em;margin:32px 0 14px;color:var(--c);display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--c),transparent) 1}
h2 span.pg{margin-left:auto;font:600 .8rem var(--fb),sans-serif;color:var(--mu);letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px 14px;perspective:900px}
.card{position:relative;padding:16px 15px 14px;overflow:hidden;transform:translateY(var(--ty,0px)) rotate(var(--r,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s,box-shadow .25s,opacity .3s,filter .3s;animation:pop .6s backwards cubic-bezier(.2,.9,.3,1.2)}
.grid .card:nth-child(3n+1){--r:calc(var(--rv,0)*-1.2deg)}.grid .card:nth-child(3n+2){--r:calc(var(--rv,0)*.9deg)}
.card::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,var(--c),transparent)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 50%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover{--ty:-5px;--r:0deg;box-shadow:0 14px 30px -10px var(--c)}.card:hover::after{opacity:1}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.9)}}
.card.pick{animation:pk .14s infinite}.card.won{animation:win 1.2s 2;box-shadow:0 0 0 3px var(--ac),0 0 44px var(--ac)}
@keyframes pk{50%{box-shadow:0 0 0 3px var(--ac),0 0 30px var(--ac)}}@keyframes win{50%{scale:1.06}}
.note{font-size:.76rem;min-height:1.1em}
.card h3{font:700 1.08rem/1.3 var(--fb),sans-serif;margin:4px 0 14px;overflow-wrap:anywhere}
.act{display:flex;justify-content:space-between;align-items:center;gap:8px}
.clr{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer;user-select:none}.clr input{width:20px;height:20px;accent-color:var(--c)}

.stamp::before{content:var(--stmp)}

.hub{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.big{position:relative;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:2rem;margin:4px 0 20px;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.55),var(--c) 40%,rgba(0,0,0,.65));box-shadow:0 0 30px -4px var(--c),inset -10px -10px 20px rgba(0,0,0,.5);animation:fl 5s ease-in-out infinite;transition:scale .3s}
.big::after{content:"";position:absolute;inset:-8px -22px;border:2px solid var(--c);border-radius:50%;opacity:.55;transform:rotateX(72deg) rotate(-15deg);animation:ring 8s linear infinite}
.hub .card:nth-child(2n) .big{animation-delay:-1.5s}

a.hubc:hover .big{scale:1.15}
.xp.mini{height:6px;margin:12px 0 0}.xp.mini i{background:var(--c);animation:none;box-shadow:0 0 10px var(--c)}

@keyframes burst{to{transform:translate(var(--dx),var(--dy));opacity:0}}

#flash.on{animation:lt .8s}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
